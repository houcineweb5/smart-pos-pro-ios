<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="55%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="5" />
  <rect x="22" y="22" width="212" height="212" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Merged SP Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Letter P (interlocked/merged with S) -->
    <path d="M 122 58 L 172 58 C 198 58 214 73 214 96 C 214 119 198 134 172 134 L 146 134 L 146 198 L 122 198 Z M 146 80 L 146 112 L 169 112 C 182 112 190 106 190 96 C 190 86 182 80 169 80 Z" fill="url(#pGrad)" />

    <!-- Letter S overlapping and fused into P's spine -->
    <path d="M 136 78 C 124 68 109 64 94 64 C 66 64 46 79 46 101 C 46 121 62 131 89 138 C 111 143 118 148 118 159 C 118 171 106 178 89 178 C 73 178 59 172 48 161 L 34 180 C 49 193 68 200 90 200 C 121 200 143 184 143 158 C 143 136 127 125 98 118 C 77 113 70 108 70 99 C 70 89 80 84 95 84 C 107 84 118 88 126 95 Z" fill="url(#sGrad)" />
  </g>
</svg>
