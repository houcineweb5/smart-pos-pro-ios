name: Build iOS IPA (Smart POS Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS .ipa (for Sideloadly / AltStore)
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          npx vite build
          npx cap sync ios

      - name: Configure iOS Camera Permission for Barcode Scanner
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'يحتاج التطبيق إلى الكاميرا لمسح الباركود ورموز QR للمنتجات'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'يحتاج التطبيق إلى الكاميرا لمسح الباركود ورموز QR للمنتجات'" "$PLIST"

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into SmartPOS-Pro.ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          cp "$ICON_SET/AppIcon-60x60@2x.png" Payload/App.app/AppIcon60x60@2x.png || true
          cp "$ICON_SET/AppIcon-60x60@3x.png" Payload/App.app/AppIcon60x60@3x.png || true
          cp "$ICON_SET/AppIcon-76x76@2x.png" Payload/App.app/AppIcon76x76@2x~ipad.png || true
          cp "$ICON_SET/AppIcon-60x60@2x.png" Payload/App.app/Icon-60@2x.png || true
          cp "$ICON_SET/AppIcon-60x60@3x.png" Payload/App.app/Icon-60@3x.png || true
          cp "$ICON_SET/AppIcon-512@2x.png" Payload/App.app/iTunesArtwork@2x || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string 'AppIcon'" "Payload/App.app/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName 'AppIcon'" "Payload/App.app/Info.plist"
          zip -r SmartPOS-Pro-iOS.ipa Payload

      - name: Upload SmartPOS-Pro-iOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPOS-Pro-iOS-IPA
          path: SmartPOS-Pro-iOS.ipa
          retention-days: 30
