name: Build Android APK (Smart POS Pro)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor Android
        run: |
          npx vite build
          npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmartPOS-Pro-Android.apk

      - name: Upload SmartPOS-Pro-Android.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPOS-Pro-Android-APK
          path: SmartPOS-Pro-Android.apk
          retention-days: 30
